<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hermoso Descanso</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html { min-height: 100%; scroll-behavior: smooth; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(135deg, #eef2f7 0%, #e2e8f0 100%);
        color: #111827;
        line-height: 1.6;
      }
      .container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 20px;
        animation: fadeIn 0.6s ease-out;
      }
      .card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(15, 23, 42, 0.1), 0 2px 8px rgba(15, 23, 42, 0.05);
        padding: 20px;
        border: 1px solid rgba(15, 23, 42, 0.08);
        overflow: hidden;
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 48px rgba(15, 23, 42, 0.15), 0 4px 16px rgba(15, 23, 42, 0.1);
      }
      .button {
        border: none;
        border-radius: 50px;
        padding: 12px 20px;
        background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        color: white;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        position: relative;
        overflow: hidden;
      }
      .button::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
        transition: left 0.5s;
      }
      .button:hover:not(:disabled)::before {
        left: 100%;
      }
      .button:hover:not(:disabled) {
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(17, 24, 39, 0.3);
      }
      .button:active:not(:disabled) {
        transform: translateY(0);
      }
      .button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
      }
      input, select, textarea {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 12px;
        margin-top: 6px;
        font-size: 0.95rem;
        background: white;
        transition: all 0.2s ease;
        outline: none;
      }
      input:focus, select:focus, textarea:focus {
        border-color: #3b82f6;
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }
      textarea { resize: vertical; min-height: 80px; }
      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      }
      th, td {
        padding: 12px 16px;
        text-align: left;
        border-bottom: 1px solid #f1f5f9;
      }
      th {
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        font-weight: 600;
        color: #374151;
      }
      tr:hover { background: #f8fafc; }
      .card + .card { margin-top: 20px; }

      /* Modal animations */
      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0,0,0,0.6);
        backdrop-filter: blur(4px);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.3s ease-out;
      }
      .modal-content {
        background: white;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        max-width: 90vw;
        max-height: 90vh;
        animation: slideIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        overflow: hidden;
      }

      /* Form animations */
      .form-group {
        animation: slideUp 0.4s ease-out;
        animation-fill-mode: both;
      }
      .form-group:nth-child(1) { animation-delay: 0.1s; }
      .form-group:nth-child(2) { animation-delay: 0.2s; }
      .form-group:nth-child(3) { animation-delay: 0.3s; }
      .form-group:nth-child(4) { animation-delay: 0.4s; }

      /* Loading animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: scale(0.9) translateY(-20px);
        }
        to {
          opacity: 1;
          transform: scale(1) translateY(0);
        }
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
      }

      /* Responsive adjustments */
      @media (max-width: 768px) {
        .container { padding: 16px; }
        .card { padding: 16px; margin-bottom: 16px; }
        th, td { padding: 8px 12px; font-size: 0.9rem; }
      }
    </style>
  </head>
  <body>
    <div id="root"><p style="margin: 20px; color: #666;">Loading application...</p></div>
    <script>
      console.log("HTML loaded, waiting for React libraries...");
      window.appLoadTimeout = setTimeout(() => {
        if (!window.React || !window.ReactDOM) {
          const root = document.getElementById("root");
          root.innerHTML = `<div style="margin: 20px; padding: 20px; background: #fee; border: 1px solid #f99; border-radius: 8px;">
            <h3 style="color: #c33;">Failed to Load Application</h3>
            <p>The application failed to load. This could be due to:</p>
            <ul>
              <li>Slow or no internet connection</li>
              <li>CDN unreachable</li>
              <li>Browser cache issues</li>
            </ul>
            <p>Try refreshing the page or clearing your browser cache.</p>
            <p style="font-size: 0.9em; color: #666; margin-top: 20px;">
              Debug: React=${typeof window.React}, ReactDOM=${typeof window.ReactDOM}
            </p>
          </div>`;
        }
      }, 5000);
    </script>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js" crossorigin onerror="console.error('Failed to load React')"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js" crossorigin onerror="console.error('Failed to load ReactDOM')"></script>
    <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js" onerror="console.error('Failed to load Babel')"></script>
    <script>
      clearTimeout(window.appLoadTimeout);
      console.log("React libraries loaded");
      console.log("React:", typeof React);
      console.log("ReactDOM:", typeof ReactDOM);
      if (!window.React) {
        console.error("React failed to load!");
        document.getElementById("root").innerHTML = "<p style='color:red; margin: 20px;'>ERROR: React library failed to load. Try refreshing.</p>";
      }
    </script>
    <script type="text/babel" src="app.js" onerror="console.error('Failed to load app.js')"></script>
  </body>
</html>
